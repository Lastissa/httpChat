{% comment %}
    nav.html
{% endcomment %}
<nav class="site-nav" aria-label="Primary">
    <div class="site-nav__inner container">

        <a href="{% url 'account_login' %}" class="site-nav__brand" aria-label="{{ project_name }} home">
            <svg class="site-nav__logo" viewBox="0 0 40 40" aria-hidden="true">
                <rect width="40" height="40" rx="12" fill="var(--color-action-primary)"></rect>
                <circle cx="13" cy="22" r="3.4" fill="#fff"></circle>
                <circle cx="20" cy="22" r="3.4" fill="#fff"></circle>
                <circle cx="27" cy="22" r="3.4" fill="#fff"></circle>
            </svg>
            <span>{{ project_name }}</span>
        </a>

        <!-- Desktop link row -->
        <div class="site-nav__links" id="site-nav-links">
            <a href="{% url 'account_login' %}" class="site-nav__link">Login</a>
            <a href="{% url 'account_signup' %}" class="site-nav__link">Sign Up</a>

            <button type="button" id="theme-toggle" class="theme-toggle-btn"
                    aria-pressed="false" aria-label="Switch to dark theme">
                <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                </svg>
            </button>
        </div>

        <!-- Mobile 3-dot menu -->
        <div class="nav-kebab" id="nav-kebab">
            <button type="button" class="nav-kebab-btn" id="nav-kebab-btn"
                    aria-haspopup="true" aria-expanded="false" aria-controls="nav-kebab-menu"
                    aria-label="Open menu">
                <span class="nav-kebab-dots" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div class="nav-kebab-menu" id="nav-kebab-menu" role="menu">
                <a href="{% url 'account_login' %}" class="site-nav__link" role="menuitem">Login</a>
                <a href="{% url 'account_signup' %}" class="site-nav__link" role="menuitem">Sign Up</a>
                <button type="button" id="theme-toggle-mobile" class="theme-toggle-btn" role="menuitem"
                        aria-pressed="false" aria-label="Switch to dark theme">
                    <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                    </svg>
                    <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>

    </div>
</nav>
